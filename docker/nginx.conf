# Wizzy SPA. TLS e HTTP->HTTPS ficam no proxy da frente (Nginx Proxy Manager),
# aqui e so HTTP na porta 80 da rede interna.

# IP real nos logs (o proxy fala com a gente por IP privado do Docker).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A CSP do app vem na meta tag do index.html. Nao duplicar aqui:
    # duas politicas se somam pela intersecao e quebram o app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nao mando X-Frame-Options porque a CSP ja define frame-ancestors/frame-src,
    # e o widget de chat pode precisar ser embutido.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Alvo do healthcheck do container e do proxy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome: podem ser cacheados pra sempre.
    # Sem `expires` aqui: ele emitiria um segundo Cache-Control junto do add_header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Instalador do CNIS runner (~347MB, so existe se a imagem foi buildada
    # com INCLUDE_CNIS_INSTALLER=true). Binario grande: sem gzip, com sendfile.
    location /downloads/ {
        gzip off;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # index.html nunca cacheia: e o arquivo que aponta pros assets novos
    # depois de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # BrowserRouter: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sem tolerancia a arquivos de config vazados junto do build.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
